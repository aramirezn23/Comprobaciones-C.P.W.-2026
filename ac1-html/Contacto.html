  <main id="Contenido-principal">
    <h3 id="sobre-nosotros"></h3>
    <h3 id="nuestra-mision"></h3>
    <h3 id="flores-arreglos"></h3>

    <h2>Formulario de matrícula</h2>
        <form action="#" method="post">
            <!--FORM: Contenedor del formlario. Action es donde se envía el formulario
            method: es el método de envío. Post: Envío de datos por el cuerpo de la solicitud-->
            <fieldset>
                <legend>Información personal</legend>
                <p>
                    <label for="nombre">Nombre</label>
                    <input type="text" name="nombre" id="nombre" required><br><br>
                </p>
               <p>
                    <label for="correo">Correo electrónico</label>
                    <input type="email" name="correo" id="correo" required><br><br>
                </p>
                <button type="submit">Enviar matrícula</button>      
            </fieldset>
        </form>

 <fieldset>
            <legend>Detalles de matrícula</legend>
            <p>
                <label for="Teléfono">Teléfono</label>
                <input type="tel" id="Teléfono" name="teléfono" pattern="(0-9)(8)" title="Ingrese un número de teléfono válido de 8 dígitos"><br><br>
            </p>
            <p>
                <label for="fecha">Fecha de Inicio</label>
                <input type="date" id="fecha" name="fecha"><br><br>
            </p>
            <p>
                <label for="edad">Edad</label>
                <input type="number" id="edad" name="edad" min="15" max="80" step="1"><br><br>
            </p>

        </fieldset>


  </main>

  <footer id="Pie-de-pagina"> <hr><br>
